<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAY KAY Brick Unit ERP</title>
<style>
/* ===== Brick Unit ERP · design system ===== */
:root{--bg:#f5f4f0;--cd:#ffffff;--tx:#202b36;--mu:#69747d;--bd:#e5e2dc;--ac:#a85f3b;--ac2:#c17a50;--ok:#27845b;--wn:#b87922;--bad:#c84c43;--tint:rgba(168,95,59,.10);--sh:0 1px 2px rgba(32,43,54,.04),0 5px 18px rgba(32,43,54,.055);--r:13px;color-scheme:light}
:root[data-theme="dark"]{--bg:#111820;--cd:#19232d;--tx:#edf1f2;--mu:#9aa8b2;--bd:#2b3944;--ac:#d18a61;--ac2:#e0a17b;--ok:#55bd8a;--wn:#e4b45f;--bad:#ed8278;--tint:rgba(209,138,97,.14);--sh:0 1px 2px rgba(0,0,0,.28),0 8px 24px rgba(0,0,0,.22);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:19px;margin:0}h2{font-size:15px;font-weight:650;margin:0 0 12px}b,strong{font-weight:650}
/* ---- page anatomy: header → KPIs → sections ---- */
#topbar h1{font-size:13px;font-weight:600;color:var(--mu);letter-spacing:.01em}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 18px;flex-wrap:wrap;margin-bottom:20px}
.pt{font-size:25px;font-weight:750;letter-spacing:-.03em;margin:0;display:flex;align-items:center;gap:12px}
.pt .ic{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px rgba(23,32,58,.14)}
.pt .ic svg{width:22px;height:22px}
.ps{margin:6px 0 0 0 52px;color:var(--mu);font-size:13.5px;max-width:70ch}
.cd h2{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx);opacity:.85;margin:0 0 12px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.cd h2::after{content:"";flex:1;height:1px;background:var(--bd)}
.g>.cd{border-top:3px solid var(--ac)}
.g>.cd .v{font-size:23px}
.cd:has(.f){background:color-mix(in srgb,var(--bg) 45%,var(--cd))}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;flex:0 1 auto;max-width:230px}
.toolbar .k{margin:0 2px}
.fq{min-width:170px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;align-items:start;margin-bottom:16px}
.cols>.cd{margin-bottom:0}
/* ---- app launcher home (iPhone / Zoho-style curved tiles) ---- */
.g1{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.g2{background:linear-gradient(135deg,#0ea5e9,#06b6d4)}
.g3{background:linear-gradient(135deg,#10b981,#0d9488)}
.g4{background:linear-gradient(135deg,#f59e0b,#f97316)}
.g5{background:linear-gradient(135deg,#ec4899,#f43f5e)}
.g6{background:linear-gradient(135deg,#14b8a6,#0891b2)}
#homeBtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--tint);color:var(--ac);padding:9px 11px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;margin:0 0 6px}
#homeBtn svg{width:18px;height:18px;flex:none}
#homeBtn:hover{filter:brightness(.96)}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:24px 26px;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#a855f7);color:#fff;margin-bottom:26px;box-shadow:var(--sh)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%}
.hero::before{width:230px;height:230px;right:-70px;top:-100px;background:rgba(255,255,255,.13)}
.hero::after{width:150px;height:150px;right:130px;bottom:-80px;background:rgba(255,255,255,.09)}
.hero>*{position:relative}
.hero .hk{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero .hb{font-size:26px;font-weight:750;letter-spacing:-.02em;margin:5px 0 2px}
.hero .hd{font-size:13px;opacity:.85}
.hchips{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hchip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:11px;padding:8px 13px;font-size:11.5px}
.hchip b{display:block;font-size:15px;margin-top:1px}
.hbtn{background:#fff;color:var(--ac);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:650;cursor:pointer;box-shadow:var(--sh)}
.appcat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:24px 2px 10px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.appcat::after{content:"";flex:1;height:1px;background:var(--bd)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.lchips{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 14px}
.lchips button{border:1px solid var(--bd);background:var(--cd);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;color:var(--tx);cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:border-color .15s,background .15s,color .15s}
.lchips button b{font-weight:600;font-size:11px;background:var(--bg);color:var(--mu);border-radius:999px;padding:1px 8px}
.lchips button:hover{border-color:var(--ac)}
.lchips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lchips button.on b{background:rgba(255,255,255,.25);color:#fff}
.lwrap{display:grid;grid-template-columns:1fr;gap:16px}
.appsec{border:1px solid var(--bd);border-radius:20px;background:var(--cd);padding:8px 12px 14px;box-shadow:var(--sh)}
.appsec .appcat{margin:8px 2px 12px}
.appcat b{font-weight:600;font-size:10px;letter-spacing:0;text-transform:none;color:var(--mu);background:var(--bg);border-radius:999px;padding:2px 8px}
.app{display:flex;flex-direction:column;align-items:flex-start;gap:11px;background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;cursor:pointer;font:inherit;color:var(--tx);text-align:left;transition:transform .16s,box-shadow .16s,border-color .16s}
.app:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(23,32,58,.15);border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.app:active{transform:translateY(-1px)}
.ai{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px rgba(23,32,58,.16)}
.ai svg{width:23px;height:23px}
.an{font-weight:650;font-size:14px}
.ad{font-size:12px;color:var(--mu);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.astat{margin-top:auto;padding-top:9px;border-top:1px dashed var(--bd);font-size:11px;color:var(--mu);width:100%}
.astat b{color:var(--ac);font-size:13px;margin-right:3px}
/* ---- side panel vs apps-only view (toggle in top bar) ---- */
@media(min-width:921px){
 body.in.noside #app{grid-template-columns:minmax(0,1fr)}
 body.in.noside #sidebar{display:none}
}
#menuBtn.on{border-color:var(--ac);color:var(--ac)}
/* ---- global search results ---- */
.global-search{position:relative}
#gsr{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--cd);border:1px solid var(--bd);border-radius:12px;box-shadow:0 16px 44px rgba(23,32,58,.22);max-height:min(440px,62vh);overflow-y:auto;display:none;z-index:70;padding:6px}
#gsr.open{display:block}
#gsr .gh{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:9px 10px 3px}
#gsr button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;color:var(--tx);font:inherit;font-size:13.5px;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left}
#gsr button:hover,#gsr button.sel{background:var(--tint)}
#gsr button .gi{flex:none;width:27px;height:27px;border-radius:8px;display:grid;place-items:center;color:#fff}
#gsr button .gi svg{width:15px;height:15px}
#gsr button .gm{min-width:0;flex:1}
#gsr button .gm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gsr button .gm span{display:block;font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gsr button .gt{flex:none;font-size:9.5px;font-weight:700;color:var(--mu);background:var(--bg);border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
#gsr .gempty{padding:14px 12px;font-size:13px;color:var(--mu)}
/* ---- stacked settings sections ---- */
.setwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.setnav{position:sticky;top:76px;display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--bd);border-radius:14px;background:var(--cd);box-shadow:var(--sh)}
.setnav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--mu);border-radius:9px;padding:9px 11px;font:inherit;font-size:13.5px;cursor:pointer}
.setnav button:hover{background:var(--tint)}
.setnav button.on{background:var(--tint);border-color:color-mix(in srgb,var(--ac) 25%,var(--bd));color:var(--ac);font-weight:600}
@media(max-width:820px){.setwrap{grid-template-columns:1fr}.setnav{position:static;flex-direction:row;flex-wrap:wrap}}
#menuBtn svg{width:16px;height:16px}
#themeBtn svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
button.s svg{width:12px;height:12px;vertical-align:-1.5px}

/* ---- employee badges & chips ---- */
.bdg{display:inline-block;font-size:9.5px;font-weight:700;padding:2.5px 8px;border-radius:6px;background:var(--tint);color:var(--ac);text-transform:uppercase;letter-spacing:.05em;margin-left:6px;vertical-align:1px;white-space:nowrap}
.bdg.off{background:color-mix(in srgb,var(--mu) 15%,transparent);color:var(--mu)}
.bdg.tm{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.wchip{display:inline-block;font-size:11px;padding:2.5px 9px;border-radius:999px;border:1px solid var(--bd);color:var(--mu);margin:1px 4px 1px 0;white-space:nowrap}
.wlb{display:inline-flex;gap:6px;align-items:center;margin:0 16px 6px 0;font-size:14px;color:var(--tx)}
.wlb input{width:auto}
/* ---- shell: sidebar + content ---- */
#app{display:none}
body.in #app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
#sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--cd);border-right:1px solid var(--bd);padding:16px 12px 12px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px}
#sidebar .brand{padding:2px 10px 14px}
.logo{width:37px;height:37px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;box-shadow:var(--sh)}
.logo svg{width:19px;height:19px}
.brand b{font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .tag{margin-left:auto;flex:none;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ac);background:var(--tint);border-radius:6px;padding:2px 6px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav .cat{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);padding:14px 10px 5px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:8px 10px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px;position:relative;white-space:nowrap}
#nav button .ic{flex:none;width:20px;height:20px;display:grid;place-items:center}
#nav button .ic svg{width:19px;height:19px}
#nav button:hover{background:var(--tint)}
#nav button.on{background:var(--tint);color:var(--ac);font-weight:600}
#nav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--ac),var(--ac2))}
.sideFoot{margin-top:auto;padding:12px 6px 4px;display:flex;flex-direction:column;gap:8px}
.sideFoot .k{font-size:11px}
#content{display:flex;flex-direction:column;min-width:0}
#topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:11px 18px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
#menuBtn{display:grid;place-items:center;font-size:15px;flex:none}
#who{margin-left:auto;font-size:13px;color:var(--mu);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{padding:20px;max-width:1080px;width:100%;margin:0 auto}
#overlay{display:none;position:fixed;inset:0;background:rgba(9,13,26,.45);z-index:38}
/* ---- login ---- */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 480px at 15% -5%,var(--tint),transparent),radial-gradient(800px 520px at 105% 105%,color-mix(in srgb,var(--ac2) 12%,transparent),transparent),var(--bg)}
body:not(.in) #login{display:flex}
.lc{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:26px;max-width:372px;width:100%;box-shadow:var(--sh)}
.lc input{margin-bottom:12px}
/* ---- cards, stats, forms ---- */
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.g .cd{margin-bottom:0;padding:14px 16px}
.k{font-size:12px;color:var(--mu)}.v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit;transition:border-color .15s,box-shadow .15s}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--tint)}
input:disabled,textarea:disabled{opacity:.55;background:var(--bg)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
/* ---- buttons ---- */
button.b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600;box-shadow:var(--sh);transition:filter .15s,transform .1s}
button.b:hover{filter:brightness(1.07)}button.b:active{transform:translateY(1px)}
button.s,a.s{background:var(--cd);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;text-decoration:none;display:inline-block;line-height:1.4;transition:border-color .15s,color .15s}
button.s:hover,a.s:hover{border-color:var(--ac);color:var(--ac)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* ---- tables ---- */
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:600;background:color-mix(in srgb,var(--bg) 55%,var(--cd))}
th:first-child{border-top-left-radius:8px}th:last-child{border-top-right-radius:8px}
tr:last-child td{border-bottom:0}td{background:var(--cd)}
table tr:hover td{background:color-mix(in srgb,var(--ac) 4%,transparent)}
/* ---- status colors, alerts ---- */
.r{text-align:right}.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}.mu{color:var(--mu)}
.al{padding:11px 14px;border-radius:10px;margin-bottom:10px;background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-left:4px solid var(--bad)}
.al.w{background:color-mix(in srgb,var(--wn) 12%,transparent);border-color:color-mix(in srgb,var(--wn) 35%,transparent);border-left-color:var(--wn)}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(9,13,26,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px;z-index:60}
#modal>div{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:22px;max-width:600px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:mpop .18s ease}
@keyframes mpop{from{opacity:0;transform:translateY(12px) scale(.985)}}
#modal th,#modal td{border-color:var(--bd)}
/* ---- responsive: sidebar becomes a drawer ---- */
@media(max-width:920px){
 body.in #app{grid-template-columns:1fr}
 #sidebar{position:fixed;left:0;top:0;bottom:0;width:262px;z-index:40;transform:translateX(-104%);transition:transform .22s ease;box-shadow:0 0 44px rgba(0,0,0,.28)}
 body.navOpen #sidebar{transform:none}
 body.navOpen #overlay{display:block}
 #menuBtn{display:grid;place-items:center;font-size:15px}
 main{padding:14px}
 #topbar{padding:10px 12px}#who{font-size:12px}
}
/* ---- design system v2: segmented tabs, rich tables, dialogs, charts ---- */
.toolbar{gap:6px}
.toolbar button.b,.toolbar button.s{border-radius:9px;padding:7px 13px;font-size:13px}
.toolbar .seg{display:inline-flex;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.toolbar .seg button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--mu);font-weight:600}
.toolbar .seg button.on{background:var(--cd);color:var(--tx);box-shadow:0 1px 3px rgba(23,32,58,.12)}
table thead th{position:sticky;top:0;z-index:2}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 45%,var(--cd))}
tbody tr:hover td{background:color-mix(in srgb,var(--ac) 6%,transparent)}
#modal{align-items:center}
#modal>div{border-radius:14px;max-width:640px;width:100%;max-height:calc(100vh - 48px);overflow:auto;animation:mpop .16s cubic-bezier(.2,.9,.3,1.2)}
.dlghead{display:flex;align-items:center;gap:11px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.dlghead .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:#fff}
.dlghead .ic svg{width:17px;height:17px}
.dlghead b{font-size:16px}
.dlghead .k{margin:2px 0 0}
.dlgclose{margin-left:auto;flex:none}
.dlgfoot{display:flex;gap:8px;justify-content:flex-end;margin:16px 0 0}
.qa{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:13px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.qa>.ic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;color:#fff}
.qa>.ic svg{width:18px;height:18px}
.qat{flex:1;min-width:180px}
.qat b{display:block;font-size:14.5px}
.qat .k{margin:1px 0 0}
.qa>.b{flex:none;white-space:nowrap;margin-left:auto}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:6px}
.chart .bar{flex:1;min-width:7px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac2) 70%,var(--ac)));position:relative}
.chart .bar:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);font-size:10.5px;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:3}
.chart .bar.zero{background:color-mix(in srgb,var(--mu) 22%,transparent)}
.ax{display:flex;gap:4px;margin-top:5px}
.ax span{flex:1;min-width:7px;text-align:center;font-size:9px;color:var(--mu)}
.app.off{cursor:default;opacity:.62}
.app.off:hover{transform:none;box-shadow:var(--sh)}
.app.off .ai{background:color-mix(in srgb,var(--mu) 16%,var(--cd));color:var(--mu);box-shadow:none}
.app.off .soon{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--wn);background:color-mix(in srgb,var(--wn) 13%,transparent);border-radius:6px;padding:2px 7px;margin-top:auto;align-self:flex-start}
.vatln{display:flex;justify-content:space-between;gap:16px;padding:2px 0;font-size:13px;color:var(--mu)}

/* ---- print (invoices / statements): always light, even in dark mode ---- */
@media print{body.in #app{display:none}#modal{position:static;background:none;padding:0;backdrop-filter:none}#modal>div{box-shadow:none;border:0;max-width:100%}.nob{display:none}
 :root{--cd:#fff;--tx:#1a1a1a;--mu:#555;--bd:#ddd;background:#fff}

/* ---- calculations ---- */
function stock(){const o={};const days=Math.min(14,Math.max(1,S.prod.length?Math.round((new Date(today())-new Date(S.prod.map(p=>p.date).sort()[0]))/864e5)+1:1));
 const from=addD(today(),-13);
 MAT.forEach(([k])=>{const b=sum(S.pur,p=>p.mat==k?p.qty:0),c=sum(S.pur,p=>p.mat==k?p.cost:0),u=sum(S.prod,p=>p.u[k]||0);
  const rec=sum(S.prod.filter(p=>p.date>=from),p=>p.u[k]||0)/days;
  const left=b-u;o[k]={b,c,u,avg:b>0?c/b:0,left,use:rec,dl:rec>0?left/rec:null};
  o[k].low=left<=0&&(b>0||u>0)||(o[k].dl!==null&&o[k].dl<=S.set.warn)});return o}
const paid=id=>sum(S.pay.filter(p=>p.sid==id),p=>p.amt);
function pnl(a,b){const st=stock(),P=S.prod.filter(p=>inR(p.date,a,b)),L=S.sales.filter(s=>inR(s.date,a,b)),E=S.exp.filter(e=>inR(e.date,a,b));
 const rev=sum(L,s=>s.total),mat=sum(MAT,([k])=>sum(P,p=>p.u[k]||0)*st[k].avg),pw=sum(P,p=>p.qty*p.rate),lw=sum(L,s=>s.loaded*s.lrate),ex=sum(E,e=>e.amt);
 const cats={};E.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amt);
 return{rev,mat,pw,lw,ex,cats,net:rev-mat-pw-lw-ex,coll:sum(L,s=>paid(s.id)),bricks:sum(P.filter(p=>p.k!='work'),p=>p.qty),sold:sum(L,s=>sum(s.items,i=>i.qty))}}
const recv=()=>S.sales.map(s=>({s,bal:s.total-paid(s.id)})).filter(x=>x.bal>0.005).sort((a,b)=>(a.s.due||'9')<(b.s.due||'9')?-1:1);

 <div class="cd"><h2>Activity this month by type</h2>${tbl(['Type','Entries'],Object.entries(byt).map(([k,v])=>row([`<span class="bdg">${k}</span>`,v],['','r'])).join(''))}</div>
 <div class="cd"><h2>Audit trail</h2>${fbar('type, party or note',drng())}${tbl(['Date','Type','What happened','Amount'],rows)}<p class="k">Newest first. Delete an entry anywhere in the app and it leaves this trail too \u2013 the trail is a live view, not a copy.</p></div>`};

const ADTABS=[['set','Settings'],['usr','Users & access'],['rol','Audit trail'],['int','Integrations']];
const adNav=()=>'<div class="toolbar"><div class="seg">'+ADTABS.map(([k,n])=>'<button class="'+(AD.v==k?'on':'')+'" onclick="AD.v=\''+k+'\';Q={};render()">'+n+'</button>').join('')+'</div></div>';
V.rol=function(){return adNav()+(AD.v=='usr'?usrCore():(AD.v=='rol'?rolCore():(AD.v=='int'?V.int():setCore())))};
/* ---- users, roles and access ---- */
const UROLES=['Administrator','Manager','Accounts','Sales','Store'];
const whoEmail=()=>((($('who').textContent.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/)||[])[0])||'').trim();
const USERS=()=>S.set.users||[];
const myRole=()=>{const u=USERS().find(x=>x.email==whoEmail()&&x.active!==false);return u?u.role:'Administrator'};
const ROLE_TABS={Manager:['dash','prod','inv','acct','ven','emp','acc'],Accounts:['dash','acct','ven','acc'],Sales:['dash','acct'],Store:['dash','prod','inv']};
const allowed=id=>{const a=ROLE_TABS[myRole()];return !a||a.includes(id)||id=='home'};
function usrCore(){const me=whoEmail(),U=USERS();
 const rows=U.map(u=>row([
  '<b>'+esc(u.email)+'</b>'+(u.email==me?' <span class="bdg tm">You</span>':''),
  esc(u.name||'\u2014'),
  '<span class="bdg">'+esc(u.role||'Administrator')+'</span>',
  u.active===false?'<span class="bad">Access removed</span>':'<span class="ok">Active</span>',
  u.active===false?'<button class="s" onclick="usrAccess(\''+kq(u.email)+'\',1)">Restore access</button>':'<button class="s" onclick="dlgUsr(\''+kq(u.email)+'\')">Edit</button> <button class="s" onclick="usrReset(\''+kq(u.email)+'\')">Reset password</button> <button class="s" onclick="usrAccess(\''+kq(u.email)+'\',0)">Remove access</button>'],
  ['','','','',''])).join('');
 return qa('idcard','Create a user','Give a staff member their own email and password to sign in to this ERP, with a role that controls which apps they can open.','Add user',"dlgUsr('')")+
 '<div class="cd"><h2>User directory ('+U.length+')</h2>'+tbl(['Email','Name','Role','Status',''],rows)+
 '<p class="k">Users sign in from the sign-in screen with their own email and password. Removing access blocks them the next time the app loads for them \u2013 restore any time. Password reset emails them a Firebase link to choose a new one. Accounts created here also appear in the Firebase console (Authentication) if you ever need to manage them there.</p></div>'+
 '<div class="cd"><h2>What each role can open</h2>'+tbl(['Role','Apps they can open'],UROLES.map(r=>row(['<span class="bdg">'+r+'</span>',r=='Administrator'?'Everything, including Administration, settings and users':r=='Manager'?'Everything except Administration':r=='Accounts'?'Dashboard, Sales &amp; customers, Purchases &amp; vendors, Accounting':r=='Sales'?'Dashboard and Sales &amp; customers':'Dashboard, Production, Inventory'],['',''])).join(''))+'<p class="k">Anyone not in this directory signs in as Administrator (the owner). Change a role any time with Edit.</p></div>'}
function dlgUsr(k){const e=k?decodeURIComponent(k):'',u=e?USERS().find(x=>x.email==e):null;
 dlg('idcard',u?'Edit user':'Create user','<div class="f"><div><label>Email (used to sign in)</label><input id="u_em" type="email" value="'+(u?esc(u.email):'')+'"'+(u?' disabled':'')+'></div><div><label>Full name</label><input id="u_nm" value="'+(u?esc(u.name||''):'')+'"></div><div><label>Role</label><select id="u_rl">'+UROLES.map(r=>'<option'+(u&&u.role==r?' selected':'')+'>'+r+'</option>').join('')+'</select></div>'+(u?'':'<div><label>Password (min 6 characters)</label><input id="u_pw" type="password" autocomplete="new-password"></div>')+'</div>',
 u?'Change the name or role. Use Reset password in the directory to email them a new one.':'They sign in with this email and password from the sign-in screen, and can change the password later.',
 '<button class="b" onclick="usrSave(\''+kq(e)+'\')">'+(u?'Save changes':'Create user')+'</button>')}
async function usrSave(k){const e=k?decodeURIComponent(k):'',u=e?USERS().find(x=>x.email==e):null;
 const nm=val('u_nm').trim(),rl=val('u_rl');
 if(u){if(u.email==whoEmail()&&rl!='Administrator'&&!confirm('You are changing YOUR OWN role to '+rl+'. You may lose access to Administration and users. Continue?'))return;
  u.name=nm;u.role=rl;save();mclose();render();alert('User updated.');return}
 const em=val('u_em').trim(),pw=val('u_pw')||'';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return alert('Enter a valid email address.');
 if(pw.length<6)return alert('Choose a password of at least 6 characters.');
 if(USERS().some(x=>x.email==em))return alert('That email is already in the user directory.');
 if(em==whoEmail())return alert('You are already signed in with that email.');
 if(!window.erpCreateUser)return alert('User management needs Firebase sign-in to be configured.');
 try{await window.erpCreateUser(em,pw,nm)}catch(err){return alert('Could not create the sign-in: '+(err.message||err))}
 S.set.users=USERS().concat([{email:em,name:nm,role:rl,active:true}]);
 save();mclose();render();alert('User created. '+em+' can now sign in with the password you set.')}
async function usrReset(k){const em=decodeURIComponent(k);
 if(!confirm('Send a password reset email to '+em+'? They choose a new password from the link in it.'))return;
 try{await window.erpResetPw(em);alert('Password reset email sent to '+em+' (ask them to check spam too).')}catch(e){alert('Could not send: '+(e.code||e.message||e))}}
function usrAccess(k,on){const em=decodeURIComponent(k),u=USERS().find(x=>x.email==em);if(!u)return;
 if(em==whoEmail()&&!on)return alert('You cannot remove your own access while signed in.');
 if(on){u.active=true;save();render();alert(em+' can sign in again.');return}
 if(!confirm('Remove ERP access for '+em+'? They stay in the directory and can be restored any time.'))return;
 u.active=false;save();render();alert('Access removed for '+em+'.')}
/* ---- settings: stacked sections ---- */
const STABS=[['biz','Business & tax'],['rates','Production & rates'],['sizes','Brick sizes & work'],['ven','Vendors'],['data','Data & backup']];
const stNav=()=>'<div class="setnav">'+STABS.map(([k,n])=>'<button class="'+(ST.v==k?'on':'')+'" onclick="ST.v=\''+k+'\';render()">'+n+'</button>').join('')+'</div>';
function setCore(){let body='';
 if(ST.v=='rates')body=stRates();else if(ST.v=='sizes')body=stSizes();else if(ST.v=='ven')body=stVen();else if(ST.v=='data')body=stData();else body=stBiz();
 return '<div class="setwrap">'+stNav()+'<div>'+body+'</div></div>'}
function stBiz(){const s=S.set;return '<div class="cd"><h2>Business &amp; tax</h2><div class="f"><div><label>Business name</label><input id="s_biz" value="'+esc(s.biz)+'"></div><div><label>Currency symbol</label><input id="s_cur" value="'+esc(s.cur)+'"></div><div><label>VAT % (shown on invoices)</label><input type="number" id="s_vat" step="any" value="'+(s.vat||0)+'"></div><div><label>Phone country code (for WhatsApp)</label><input id="s_cc" value="'+(s.cc||'91')+'"></div><div><label>Loading charge / brick</label><input type="number" id="s_load" step="any" value="'+s.load+'"></div><div><label>Reorder warning (days left)</label><input type="number" id="s_warn" value="'+s.warn+'"></div></div><p><button class="b" onclick="saveBiz()">Save business settings</button></p><p class="k">The business name shows on invoices and statements; VAT feeds the Tax &amp; VAT report.</p></div>'}
function saveBiz(){const s=S.set;s.biz=val('s_biz');s.cur=val('s_cur');s.vat=num('s_vat')||0;s.cc=(val('s_cc')||'91').replace(/\D/g,'')||'91';['load','warn'].forEach(k=>s[k]=num('s_'+k));save();render();alert('Business settings saved.')}
function stRates(){const s=S.set,rec=s.rec||{};
 return '<div class="cd"><h2>Buckets &amp; measuring</h2><p class="k">Metal and sand are stored in cubic feet (cu ft). Trucks bring loads and each load can differ, so you enter the cu ft per load on every purchase; the defaults below are only a starting point. Production usage is entered in buckets.</p><div class="f"><div><label>Bucket size (litres)</label><input type="number" id="s_bk" step="any" value="'+s.bk+'" oninput="cvt()"></div><div><label>Metal buckets per 1 cement bag</label><input type="number" id="s_rm" step="any" value="'+s.rm+'" oninput="cvt()"></div><div><label>Sand buckets per 1 cement bag</label><input type="number" id="s_rs" step="any" value="'+s.rs+'" oninput="cvt()"></div><div><label>Default cu ft per load \u2013 metal</label><input type="number" id="s_lm" step="any" value="'+s.lc.m+'"></div><div><label>Default cu ft per load \u2013 sand</label><input type="number" id="s_ls" step="any" value="'+s.lc.s+'"></div><div><label>Reorder cover (days of stock to buy)</label><input type="number" id="s_oc" value="'+s.oc+'"></div></div><p class="k" id="cvt"><b>'+cvTxt(s.bk,s.rm,s.rs)+'</b></p><p class="k">1 cu ft = 28.3 litres. New production entries use the new values; old entries keep what they were saved with.</p></div>'+
 '<div class="cd"><h2>Recipe per batch \u2013 stock used by one round of production</h2>'+['4','6'].map(z=>{const r=rec[z]||{n:0,c:0,m:0,s:0};return '<div class="f" style="margin-bottom:8px"><div><label>'+z+' inch: bricks (N)</label><input type="number" id="n'+z+'" value="'+r.n+'"></div><div><label>Cement bags</label><input type="number" id="c'+z+'" step="any" value="'+r.c+'"></div><div><label>Granite metal bags</label><input type="number" id="m'+z+'" step="any" value="'+r.m+'"></div><div><label>Granite sand bags</label><input type="number" id="s'+z+'" step="any" value="'+r.s+'"></div></div>'}).join('')+'<p><button class="b" onclick="saveRates()">Save production rates</button> <span class="k">Recording production deducts stock automatically using these recipes.</span></p></div>'}
function saveRates(){const s=S.set;s.bk=num('s_bk')||15;s.rm=num('s_rm');s.rs=num('s_rs');s.oc=num('s_oc')||7;s.lc={m:num('s_lm')||1,s:num('s_ls')||1};
 s.rec={};['4','6'].forEach(z=>s.rec[z]={n:num('n'+z)||1000,c:num('c'+z),m:num('m'+z),s:num('s'+z)});
 save();render();alert('Production rates saved.')}
function stSizes(){return '<div class="cd"><h2>Brick sizes and work types</h2><p class="k">Add any new brick size or other work you pay workers for. <b>Brick</b> types can be sold and use cement, metal and sand. <b>Work</b> types are only paid to workers (no materials, no sales).</p>'+tbl(['Name','Type','Pay per unit','Selling price',''],T().map(t=>row(['<input value="'+esc(t.name)+'" onchange="updT(\''+t.id+'\',\'name\',this.value)">',t.kind=='brick'?'Brick':'Work','<input type="number" step="any" value="'+t.wage+'" onchange="updT(\''+t.id+'\',\'wage\',this.value)">',t.kind=='brick'?'<input type="number" step="any" value="'+t.price+'" onchange="updT(\''+t.id+'\',\'price\',this.value)">':'\u2014','<button class="s" onclick="delT(\''+t.id+'\')">'+IC.x+'</button>'])).join(''))+'<div class="toolbar"><button class="s" onclick="dlgT2()">New size / work type</button></div><p class="k">Changes to pay or price apply to new entries only; old entries keep what they were saved with. Edits here save automatically.</p></div>'}
function stVen(){return '<div class="cd"><h2>Vendors</h2><div class="toolbar"><button class="s" onclick="dlgVen()">New vendor</button></div>'+tbl(['Vendor','Supplies',''],S.vendors.map(v=>row([esc(v.name),v.mats.map(k=>MAT.find(x=>x[0]==k)[1]).join(', '),delB('vendors',v.id)])).join(''))+'<p class="k">Weekly payments and balances per vendor are in the Purchases &amp; vendors app.</p></div>'}
function stData(){return '<div class="cd"><h2>Backup &amp; restore</h2><p class="k">Your data is stored in the cloud database and shared by everyone who signs in. This text is a safety copy; restoring it replaces all current data.</p><p><button class="b" onclick="expJson()">Download full backup (JSON)</button></p><textarea id="bk" rows="4">'+esc(JSON.stringify(S))+'</textarea><p><button class="b" onclick="restore()">Restore from text</button></p></div>'}

/* ---- app launcher home page ---- */
const weekDue=()=>{const e=wk,f=addD(wk,6);let due=0;
 const gn=[...new Set([...S.groups.map(g=>g.name),...S.prod.map(p=>p.grp).filter(Boolean),...S.sales.flatMap(ldrs).filter(x=>x.startsWith('G:')).map(x=>x.slice(2))])];
 const wn=[...new Set([...S.emp,...S.prod.filter(p=>!p.grp).flatMap(p=>p.emps||[p.emp]),...S.sales.flatMap(ldrs).filter(x=>!x.startsWith('G:'))])];
 const earned=k=>{const isG=k.startsWith('G:');
  const P=isG?S.prod.filter(p=>p.grp==k.slice(2)&&inR(p.date,e,f)):S.prod.filter(p=>!p.grp&&(p.emps||[p.emp]).includes(k)&&inR(p.date,e,f));
  const L=S.sales.filter(s=>ldrs(s).includes(k)&&inR(s.date,e,f));
  return sum(P,p=>isG?p.qty*p.rate:sh(p)*p.rate)+sum(L,s=>s.loaded*s.lrate/ldrs(s).length)};
 [...gn.map(x=>'G:'+x),...wn].forEach(k=>{const b=earned(k)-sum(S.wp.filter(w=>w.emp==k&&w.week==e),w=>w.amt);if(b>0.005)due+=b});
 return due};
const appCounts=()=>{const t=today(),ms=t.slice(0,7)+'-01';
 return{
  dash:[q(sum(S.prod.filter(p=>p.date==t&&p.k!='work'),p=>+p.qty||0)),'bricks today'],
  prod:[q(sum(S.prod.filter(p=>p.date>=ms&&p.date<=t),p=>+p.qty||0)),'units this month'],
  inv:[m(invVal()),'stock value'],
  acct:[m(sum(recv(),x=>x.bal)),'to collect'],
  ven:[m(vOwed()),'owed to vendors'],
  emp:[EMPS().length,'on roll'],
  acc:[J().length,'journal entries'],
  rol:[USERS().filter(u=>u.active!==false).length,'users']}};

let HF=''; /* launcher category filter */
V.home=function(){const t=today(),tp=S.prod.filter(p=>p.date==t),r=recv(),mo=pnl(t.slice(0,7)+'-01',t.slice(0,7)+'-31'),ac=appCounts();
 const dt=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 return `<div class="hero"><div class="hk">ERP · Business suite</div><div class="hb">${esc(S.set.biz)}</div><div class="hd">${dt}</div>
 <div class="hchips"><span class="hchip">Today’s bricks<b>${q(sum(tp.filter(p=>p.k!='work'),p=>p.qty))}</b></span>
 <span class="hchip">To collect<b>${m(sum(r,x=>x.bal))}</b></span>
 <span class="hchip">Month net<b>${m(mo.net)}</b></span><span class="hchip">Staff<b>${S.emp.length}</b></span></div>
 <div style="margin-top:18px"><button class="hbtn" onclick="go('dash')">Open dashboard</button></div></div>
 <div class="lchips"><button class="${HF?'':'on'}" onclick="HF='';render()">All apps</button>${MODULES.filter(([cid,cn,mods])=>(!HF||HF==cid)&&mods.some(([id])=>allowed(id))).map(([cid,cn,mods])=>`<button class="${HF==cid?'on':''}" onclick="HF='${cid}';render()">${cn}<b>${mods.filter(([id])=>allowed(id)).length}</b></button>`).join('')}</div>
 <div class="lwrap">
 ${MODULES.filter(([cid])=>!HF||HF==cid).map(([cid,cname,mods])=>{const vis=mods.filter(([id])=>allowed(id));if(!vis.length)return'';return`<section class="appsec"><div class="appcat">${cname}<b>${vis.length} app${vis.length>1?'s':''}</b></div><div class="apps">${vis.map(([id,nm,ic])=>{const c=ac[id]||['',''];return `<button class="app" onclick="go('${id}')"><span class="ai ${IC[ic].g}">${IC[ic].s}</span><span class="an">${nm}</span><span class="ad">${SUB[id]||''}</span><span class="astat"><b>${c[0]}</b>${c[1]}</span></button>`}).join('')}</div></section>`}).join('')}
 ${PLANNED.length?`<section class="appsec"><div class="appcat">Coming next</div><div class="apps">${PLANNED.map(([id,nm,ic,ds])=>`<div class="app off" title="Planned module"><span class="ai">${IC[ic].s}</span><span class="an">${nm}</span><span class="ad">${ds}</span><span class="soon">Planned</span></div>`).join('')}</div></section>`:''}
 </div>`};
render();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,createUserWithEmailAndPassword,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const E=id=>document.getElementById(id),cfg=window.FIREBASE_CONFIG;
if(!cfg||String(cfg.apiKey).startsWith('PASTE')){E('lerr').textContent='Setup needed: paste your Firebase config at the top of this file.';window.doLogin=window.doReset=()=>{}}
else{
const app=initializeApp(cfg),auth=getAuth(app);
const app2=initializeApp(cfg,'kk-erp-user-admin'),auth2=getAuth(app2);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()}),ignoreUndefinedProperties:true});
const COLS=window.COLS,P=c=>'units/main/'+c,synced={};
const J=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a<b?-1:a>b?1:0)):v);
let cfgJ='',unsubs=[];
let lastErr=0;const err=e=>{console.error(e);if(Date.now()-lastErr<3000)return;lastErr=Date.now();alert(e&&e.code==='permission-denied'?'Permission denied: your Firestore rules are not published, or this email is not allowed. Data was NOT saved.':'Cloud error: '+(e&&e.code||'')+' '+(e&&e.message||e))};
window.cloudPush=()=>{const S=window.getS();
 COLS.forEach(c=>{const mp=synced[c]||(synced[c]=new Map()),cur=new Set();
  (S[c]||[]).forEach(x=>{cur.add(x.id);const j=J(x);if(mp.get(x.id)!==j){mp.set(x.id,j);setDoc(doc(db,P(c),x.id),x).catch(err)}});
  [...mp.keys()].forEach(id=>{if(!cur.has(id)){mp.delete(id);deleteDoc(doc(db,P(c),id)).catch(err)}})});
 const cj=J({set:S.set,emp:S.emp});if(cj!==cfgJ){cfgJ=cj;setDoc(doc(db,'units/main/meta/config'),{set:S.set,emp:S.emp}).catch(err)}};
function start(){
 COLS.forEach(c=>{synced[c]=new Map();unsubs.push(onSnapshot(collection(db,P(c)),snap=>{const a=[],mp=new Map();
  snap.forEach(d=>{const x=d.data();x.id=d.id;a.push(x);mp.set(d.id,J(x))});synced[c]=mp;window.getS()[c]=a;if(!snap.metadata.hasPendingWrites)window.softRender()},err))});
 unsubs.push(onSnapshot(doc(db,'units/main/meta/config'),d=>{const S=window.getS();
  if(d.exists()){const x=d.data();S.set=Object.assign({},window.DSET,x.set||{});S.emp=x.emp||[];cfgJ=J({set:S.set,emp:S.emp});if(!d.metadata.hasPendingWrites)window.softRender()}
  else if(!d.metadata.fromCache)window.cloudPush()},err))}
onAuthStateChanged(auth,u=>{
 if(u){window._kkGate=0;document.body.classList.add('in');E('who').textContent='\u2601 '+u.email+'  ';const b=document.createElement('button');b.className='s';b.textContent='Log out';b.onclick=()=>signOut(auth);E('who').appendChild(b);start();window.render()}
 else{unsubs.forEach(f=>f());unsubs=[];window.resetS();document.body.classList.remove('in');E('who').textContent=''}});
window.doLogin=()=>{E('lerr').textContent='';signInWithEmailAndPassword(auth,E('le').value.trim(),E('lp').value).catch(e=>{E('lerr').textContent=/invalid|wrong|user-not-found/.test(e.code)?'Wrong email or password.':'Sign-in failed: '+(e.code||e.message)})};
window.doReset=()=>{const em=E('le').value.trim();if(!em){E('lerr').textContent='Type your email first, then press Forgot password.';return}
 sendPasswordResetEmail(auth,em).then(()=>{E('lerr').textContent='Password reset email sent (check spam).'}).catch(e=>{E('lerr').textContent='Could not send: '+(e.code||e.message)})};
/* ---- front-end user management (Administration -> Users & access) ----
   A second Firebase app instance creates sign-ins WITHOUT signing the
   administrator out of the main session. */
window.erpCreateUser=(email,pw,name)=>createUserWithEmailAndPassword(auth2,email,pw)
 .then(c=>name?updateProfile(c.user,{displayName:String(name)}).catch(()=>{}):c)
 .then(()=>signOut(auth2))
 .catch(e=>{try{signOut(auth2).catch(()=>{})}catch(_){}
  if(e&&e.code=='auth/email-already-in-use')throw new Error('That email already has a sign-in. Restore its access from the directory, or use Reset password instead.');
  if(e&&e.code=='auth/weak-password')throw new Error('Password must be at least 6 characters.');
  if(e&&e.code=='auth/invalid-email')throw new Error('That does not look like a valid email address.');
  if(e&&e.code=='auth/operation-not-allowed')throw new Error('Email/Password sign-in is disabled in your Firebase project. Enable it in the Firebase console under Authentication > Sign-in method.');
  throw new Error((e&&e.code)||String(e))});
window.erpResetPw=email=>sendPasswordResetEmail(auth,email);
window.erpSignOut=()=>signOut(auth);

}
</script>
