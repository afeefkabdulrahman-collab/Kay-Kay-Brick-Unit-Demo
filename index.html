<style>

main{padding:4px 16px 40px;max-width:980px;margin:auto}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:600}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
button.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;font-size:14px}th{font-size:12px;color:var(--mu);font-weight:500}
.r{text-align:right}.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}.mu{color:var(--mu)}
.al{padding:9px 12px;border-radius:8px;margin-bottom:8px;background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}

#modal th,#modal td{border-color:#ddd}
#app{display:none}body.in #app{display:block}
#login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}body.in #login{display:none}
.lc{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:22px;max-width:360px;width:100%}.lc input{margin-bottom:10px}
@media print{body.in #app{display:none}#modal{position:static;background:none;padding:0}.nob{display:none}}

<script>
const K='brickunit_v1';
const D={groups:[],vendors:[],vp:[],set:{lc:{m:100,s:100},bk:15,oc:7,rm:1,rs:1,biz:'My Brick Unit',cur:'₹',w4:1.5,w6:2,load:0.5,p4:8,p6:11,warn:3,
 rec:{4:{n:1000,c:10,m:30,s:20},6:{n:1000,c:14,m:40,s:28}}},emp:[],prod:[],pur:[],sales:[],pay:[],exp:[],wp:[]};
let S=structuredClone(D);
const COLS=['prod','pur','sales','pay','exp','wp','vp','groups','vendors'];
const save=()=>{try{window.cloudPush&&window.cloudPush()}catch(e){console.error(e);alert('Save error: '+(e.code||'')+' '+(e.message||e))}};
window.getS=()=>S;window.COLS=COLS;window.DSET=D.set;
window.resetS=()=>{S=structuredClone(D);render()};
const $=i=>document.getElementById(i),val=i=>$(i).value,num=i=>parseFloat($(i).value)||0;
const tz=new Date().getTimezoneOffset()*60000;
const iso=d=>new Date(d.getTime()-tz).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const mon=s=>{const d=new Date(s+'T00:00:00');return addD(s,-((d.getDay()+6)%7))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>S.set.cur+(+n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const q=n=>(+n||0).toLocaleString(undefined,{maximumFractionDigits:1});
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const inR=(d,a,b)=>d>=a&&d<=b;
const MAT=[['c','Cement'],['m','Granite metal 1/4 inch'],['s','Granite sand']];
let tab='dash',wk=mon(today()),pf='2000-01-01',pt='2999-12-31',pm=today().slice(0,7);
const TABS=[['dash','Dashboard'],['prod','Production'],['stock','Raw materials'],['ven','Vendors'],['sales','Sales & invoices'],['pay','Weekly payroll'],['exp','Expenses'],['pnl','Profit & loss'],['set','Settings']];
const go=t=>{tab=t;render()};
function softRender(){const m=$('main'),vals={};m.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>vals[e.id]=e.type=='checkbox'?e.checked:e.value);
 const cks=[...m.querySelectorAll('input[type=checkbox]')].map(e=>e.checked),fid=document.activeElement&&document.activeElement.id;
 render();
 if($('um')&&vals.um&&vals.um!='c')uChg();
 for(const id in vals){const e=$(id);if(e&&id!='bk')e[e.type=='checkbox'?'checked':'value']=vals[id]}
 m.querySelectorAll('input[type=checkbox]').forEach((e,i)=>{if(i<cks.length)e.checked=cks[i]});
 if($('um'))uPv();
 if(fid&&$(fid))$(fid).focus()}
window.softRender=softRender;
function render(){$('ttl').textContent=S.set.biz;
 $('nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('main').innerHTML=V[tab]();}
const del=(k,id)=>{if(confirm('Delete this entry?')){S[k]=S[k].filter(x=>x.id!=id);save();render()}};
const delB=(k,id)=>`<button class="s" onclick="del('${k}','${id}')">✕</button>`;

/* ---- calculations ---- */
function stock(){const o={};const days=Math.min(14,Math.max(1,S.prod.length?Math.round((new Date(today())-new Date(S.prod.map(p=>p.date).sort()[0]))/864e5)+1:1));
 const from=addD(today(),-13);
 MAT.forEach(([k])=>{const b=sum(S.pur,p=>p.mat==k?p.qty:0),c=sum(S.pur,p=>p.mat==k?p.cost:0),u=sum(S.prod,p=>p.u[k]||0);
  const rec=sum(S.prod.filter(p=>p.date>=from),p=>p.u[k]||0)/days;
  const left=b-u;o[k]={b,c,u,avg:b>0?c/b:0,left,use:rec,dl:rec>0?left/rec:null};
  o[k].low=left<=0&&(b>0||u>0)||(o[k].dl!==null&&o[k].dl<=S.set.warn)});return o}
const paid=id=>sum(S.pay.filter(p=>p.sid==id),p=>p.amt);
function pnl(a,b){const st=stock(),P=S.prod.filter(p=>inR(p.date,a,b)),L=S.sales.filter(s=>inR(s.date,a,b)),E=S.exp.filter(e=>inR(e.date,a,b));
 const rev=sum(L,s=>s.total),mat=sum(MAT,([k])=>sum(P,p=>p.u[k]||0)*st[k].avg),pw=sum(P,p=>p.qty*p.rate),lw=sum(L,s=>s.loaded*s.lrate),ex=sum(E,e=>e.amt);
 const cats={};E.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amt);
 return{rev,mat,pw,lw,ex,cats,net:rev-mat-pw-lw-ex,coll:sum(L,s=>paid(s.id)),bricks:sum(P.filter(p=>p.k!='work'),p=>p.qty),sold:sum(L,s=>sum(s.items,i=>i.qty))}}
const recv=()=>S.sales.map(s=>({s,bal:s.total-paid(s.id)})).filter(x=>x.bal>0.005).sort((a,b)=>(a.s.due||'9')<(b.s.due||'9')?-1:1);

/* ---- views ---- */
const row=(h,cls)=>`<tr>${h.map((c,i)=>`<td class="${cls&&cls[i]||''}">${c}</td>`).join('')}</tr>`;
const tbl=(hd,rows)=>`<div class="sc"><table><tr>${hd.map(h=>`<th>${h}</th>`).join('')}</tr>${rows||`<tr><td class="mu" colspan="${hd.length}">Nothing yet</td></tr>`}</table></div>`;
const empOpts=()=>S.emp.map(e=>`<option>${esc(e)}</option>`).join('');
const V={
dash(){const st=stock(),t=today(),tp=S.prod.filter(p=>p.date==t),r=recv(),mo=pnl(t.slice(0,7)+'-01',t.slice(0,7)+'-31');
 let al='';MAT.forEach(([k,n])=>{const x=st[k];if(x.low)al+=`<div class="al">⚠ <b>${n}</b>: ${q(x.left)} ${UN[k]} left${x.dl!==null?` (~${q(Math.max(x.dl,0))} days at ${q(x.use)}/day)`:''}. Reorder now.</div>`});
 r.filter(x=>x.s.due&&x.s.due<=t).forEach(x=>al+=`<div class="al w">💰 <b>${esc(x.s.cust)}</b> owes ${m(x.bal)} (${x.s.no}) — follow-up due ${x.s.due}${x.s.phone?' · '+esc(x.s.phone):''}</div>`);
 return `${al||'<div class="cd ok">✓ No stock or payment reminders today.</div>'}
 <div class="g"><div class="cd"><div class="k">Today’s bricks</div><div class="v">${q(sum(tp.filter(p=>p.k!='work'),p=>p.qty))}</div></div>
 <div class="cd"><div class="k">Total to collect</div><div class="v ${r.length?'wn':''}">${m(sum(r,x=>x.bal))}</div></div>
 <div class="cd"><div class="k">This month net profit</div><div class="v ${mo.net<0?'bad':'ok'}">${m(mo.net)}</div></div>
 <div class="cd"><div class="k">Month revenue</div><div class="v">${m(mo.rev)}</div></div><div class="cd"><div class="k">Owed to vendors</div><div class="v ${vOwed()>0.005?'wn':''}">${m(vOwed())}</div></div></div>
 <div class="cd"><h2>Raw material stock</h2>${tbl(['Material','In stock','Avg use/day','Days left'],MAT.map(([k,n])=>row([n,q(st[k].left)+' '+UN[k],q(st[k].use),st[k].dl===null?'—':q(Math.max(st[k].dl,0))],['','','',st[k].low?'bad':'ok'])).join(''))}</div>`},
prod(){const rows=[...S.prod].sort((a,b)=>b.date<a.date?-1:1).slice(0,40).map(p=>row([p.date,esc(p.emp),p.size+' inch',q(p.qty),m(p.rate),m(p.qty*p.rate),delB('prod',p.id)],['','','','r','r','r'])).join('');
 return `<div class="cd"><h2>Daily production entry</h2>${S.emp.length?`<div class="f"><div><label>Date</label><input type="date" id="pd" value="${today()}"></div>
 <div><label>Worker</label><select id="pe">${empOpts()}</select></div>
 <div><label>Brick size</label><select id="ps"><option value="4">4 inch</option><option value="6">6 inch</option></select></div>
 <div><label>Bricks made</label><input type="number" id="pq" min="0"></div>
 <div><label>Rate/brick (override)</label><input type="number" id="pr" step="any" placeholder="default"></div><button class="b" onclick="addProd()">Add</button></div>
 <p class="k">Raw materials are deducted automatically using your recipe in Settings. Rate is saved with each entry, so changing rates later won’t alter old wages.</p>`:`<p class="mu">Add workers first in the Weekly payroll tab.</p>`}</div>
 <div class="cd"><h2>Recent production</h2>${tbl(['Date','Worker','Size','Bricks','Rate','Wage',''],rows)}</div>`},
stock(){const st=stock(),rows=[...S.pur].sort((a,b)=>b.date<a.date?-1:1).slice(0,30).map(p=>row([p.date,MAT.find(x=>x[0]==p.mat)[1],esc(p.vendor),q(p.qty),m(p.cost),m(p.qty?p.cost/p.qty:0),delB('pur',p.id)],['','','','r','r','r'])).join('');
 return `<div class="cd"><h2>Current stock</h2>${tbl(['Material','Bought','Used','In stock','Avg cost/unit','Avg use/day','Days left'],MAT.map(([k,n])=>{const x=st[k];return row([n+' ('+UN[k]+')',q(x.b),q(x.u),`<b>${q(x.left)}</b>`,m(x.avg),q(x.use),x.dl===null?'—':q(Math.max(x.dl,0))],['','r','r','r','r','r',x.low?'bad':''])}).join(''))}
 <p class="k">Reminder triggers when stock will last ${S.set.warn} days or less (based on the last 14 days’ usage). Cement is counted in bags; granite metal and granite sand are counted in loads (fractions like 0.5 load are fine).</p></div>
 <div class="cd"><h2>Record purchase</h2><div class="f"><div><label>Date</label><input type="date" id="ud" value="${today()}"></div>
 <div><label>Material</label><select id="um">${MAT.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div>
 <div><label>Vendor</label><input id="uv"></div><div><label>Quantity (cement: bags · metal/sand: loads)</label><input type="number" id="uq" step="any"></div>
 <div><label>Total cost</label><input type="number" id="uc" step="any"></div><button class="b" onclick="addPur()">Add</button></div>
 <p class="k">Tip: to correct stock after a physical count, add a negative quantity with cost 0.</p></div>
 <div class="cd"><h2>Purchase history</h2>${tbl(['Date','Material','Vendor','Qty','Cost','Per unit',''],rows)}</div>`},
sales(){const r=recv(),t=today();
 const rr=r.map(x=>row([x.s.no,esc(x.s.cust),esc(x.s.phone||''),m(x.s.total),m(x.bal),x.s.due||'—',`<button class="s" onclick="rcv('${x.s.id}')">Receive</button>`],['','','','r','r',x.s.due&&x.s.due<=t?'bad':''])).join('');
 const sl=[...S.sales].sort((a,b)=>b.date<a.date?-1:1).slice(0,40).map(s=>{const b=s.total-paid(s.id);return row([s.no,s.date,esc(s.cust),esc((s.loader||'—').replace(/^G:/,'👥 ')),q(sum(s.items,i=>i.qty)),m(s.total),b>0.005?`<span class="wn">${m(b)}</span>`:'<span class="ok">Paid</span>',`<button class="s" onclick="inv('${s.id}')">Invoice</button> ${delB('sales',s.id)}`],['','','','','r','r','r'])}).join('');
 return `<div class="cd"><h2>New sale / invoice</h2><div class="f"><div><label>Date</label><input type="date" id="sd" value="${t}"></div>
 <div><label>Customer</label><input id="sc"></div><div><label>Phone</label><input id="sp"></div></div>
 <div class="f" style="margin-top:10px"><div><label>4 inch – qty</label><input type="number" id="q4" oninput="sl()"></div><div><label>4 inch – rate</label><input type="number" id="r4" step="any" value="${S.set.p4}" oninput="sl()"></div>
 <div><label>6 inch – qty</label><input type="number" id="q6" oninput="sl()"></div><div><label>6 inch – rate</label><input type="number" id="r6" step="any" value="${S.set.p6}" oninput="sl()"></div></div>
 <div class="f" style="margin-top:10px"><div><label>Total</label><input id="st" disabled></div><div><label>Paid now (0 = credit)</label><input type="number" id="sa" step="any" value="0"></div>
 <div><label>Follow-up date (if balance)</label><input type="date" id="sf"></div>
 <div><label>Loaded on truck (bricks)</label><input type="number" id="sload"></div><div><label>Loaded by</label><select id="sby"><option value="">—</option>${S.groups.length?`<optgroup label="Teams">${S.groups.map(g=>`<option value="G:${esc(g.name)}">👥 ${esc(g.name)}</option>`).join('')}</optgroup>`:''}<optgroup label="Individuals">${empOpts()}</optgroup></select></div></div>
 <p><button class="b" onclick="addSale()">Save sale</button></p></div>
 <div class="cd"><h2>Payments to follow up</h2>${tbl(['Invoice','Customer','Phone','Total','Balance','Follow-up',''],rr)}</div>
 <div class="cd"><h2>Invoices</h2>${tbl(['No.','Date','Customer','Loaded by','Bricks','Total','Status',''],sl)}</div>`},
pay(){const e=wk,f=addD(wk,6);let tot=0;
 const rows=S.emp.map(n=>{const P=S.prod.filter(p=>(p.emps||[p.emp]).includes(n)&&inR(p.date,e,f)),L=S.sales.filter(s=>s.loader==n&&inR(s.date,e,f));
  const pw=sum(P,p=>sh(p)*p.rate),lw=sum(L,s=>s.loaded*s.lrate),pd=sum(S.wp.filter(w=>w.emp==n&&w.week==e),w=>w.amt),bal=pw+lw-pd;tot+=pw+lw;
  return row([esc(n),q(sum(P,sh)),m(pw),q(sum(L,s=>s.loaded)),m(lw),`<b>${m(pw+lw)}</b>`,m(pd),bal>0.005?`<span class="wn">${m(bal)}</span>`:'<span class="ok">Settled</span>',bal>0.005?`<button class="s" onclick="payW('${esc(n)}',${bal})">Pay</button>`:''],['','r','r','r','r','r','r','r'])}).join('');
 return `<div class="cd"><h2>Weekly payroll</h2><div class="f"><div><label>Week starting (Monday)</label><input type="date" id="wk" value="${wk}" onchange="wk=mon(this.value);render()"></div>
 <div><label>Add worker</label><input id="en" placeholder="Name"></div><button class="b" onclick="addEmp()">Add worker</button></div><p class="k">Week: ${e} to ${f}. Wages = bricks produced × rate at the time + bricks loaded × loading rate.</p>
 ${tbl(['Worker','Bricks','Production wage','Loaded','Loading wage','Total','Paid','Balance',''],rows)}<p><b>Week total: ${m(tot)}</b></p>
 <p class="k">Workers: ${S.emp.map(n=>`${esc(n)} <a href="#" onclick="rmEmp('${esc(n)}');return false">✕</a>`).join(' · ')||'none'}</p></div>`},
exp(){const rows=[...S.exp].sort((a,b)=>b.date<a.date?-1:1).slice(0,50).map(x=>row([x.date,esc(x.cat),esc(x.note),m(x.amt),delB('exp',x.id)],['','','','r'])).join('');
 return `<div class="cd"><h2>Other expenses</h2><div class="f"><div><label>Date</label><input type="date" id="xd" value="${today()}"></div>
 <div><label>Category</label><input id="xc" list="cats" placeholder="Electricity"><datalist id="cats">${['Electricity','Diesel / fuel','Machine maintenance','Rent','Water','Vehicle / transport','Licence / tax','Miscellaneous'].map(c=>`<option>${c}</option>`).join('')}</datalist></div>
 <div><label>Amount</label><input type="number" id="xa" step="any"></div><div><label>Note</label><input id="xn"></div><button class="b" onclick="addExp()">Add</button></div></div>
 <div class="cd">${tbl(['Date','Category','Note','Amount',''],rows)}</div>`},
pnl(){const a=pm+'-01',b=pm+'-31',x=pnl(a,b),r=recv();
 const L=(n,v,c)=>row([n,m(v)],['',(c||'')+' r']);
 return `<div class="cd"><h2>Profit & loss</h2><div class="f"><div><label>Month</label><input type="month" id="pmn" value="${pm}" onchange="pm=this.value;render()"></div></div>
 <div class="sc"><table>${L('Sales invoiced ('+q(x.sold)+' bricks)',x.rev,'ok')}
 ${row(['<b>Direct costs</b>',''])}${L('Raw materials used ('+q(x.bricks)+' bricks made)',-x.mat)}${L('Production wages',-x.pw)}${L('Loading wages',-x.lw)}
 ${L('<b>Gross profit</b>',x.rev-x.mat-x.pw-x.lw)}${row(['<b>Other expenses</b>',''])}${Object.entries(x.cats).map(([c,v])=>L(esc(c),-v)).join('')||row(['<span class="mu">none</span>',''])}
 ${L('<b>NET PROFIT</b>',x.net,x.net<0?'bad':'ok')}</table></div>
 <p class="k">Cash view for the month: collected ${m(x.coll)} of ${m(x.rev)} invoiced. Total pending from customers (all time): <b class="wn">${m(sum(r,y=>y.bal))}</b>. Raw materials are costed at your average purchase price.</p></div>`},
set(){const s=S.set;return `<div class="cd"><h2>Business & rates</h2><div class="f"><div><label>Business name</label><input id="s_biz" value="${esc(s.biz)}"></div><div><label>Currency symbol</label><input id="s_cur" value="${esc(s.cur)}"></div>
 
 <div><label>Loading charge / brick</label><input type="number" id="s_load" step="any" value="${s.load}"></div>
 <div><label>Reorder warning (days left)</label><input type="number" id="s_warn" value="${s.warn}"></div></div></div>
 <div class="cd"><h2>Granite metal and sand – measuring</h2><p class="k">Metal and sand are stored in cubic feet (cu ft). Trucks bring loads and each load can differ, so you enter the cu ft per load on every purchase (the values below are only the default). Production usage is entered in buckets.</p><div class="f"><div><label>Bucket size (litres)</label><input type="number" id="s_bk" step="any" value="${s.bk}" oninput="cvt()"></div><div><label>Metal buckets per 1 cement bag</label><input type="number" id="s_rm" step="any" value="${s.rm}" oninput="cvt()"></div><div><label>Sand buckets per 1 cement bag</label><input type="number" id="s_rs" step="any" value="${s.rs}" oninput="cvt()"></div><div><label>Default cu ft per load – metal</label><input type="number" id="s_lm" step="any" value="${s.lc.m}"></div><div><label>Default cu ft per load – sand</label><input type="number" id="s_ls" step="any" value="${s.lc.s}"></div><div><label>Reorder cover (days of stock to buy)</label><input type="number" id="s_oc" value="${s.oc}"></div></div><p class="k" id="cvt"><b>${cvTxt(s.bk,s.rm,s.rs)}</b></p><p class="k">1 cu ft = 28.3 litres. These are sample values – set yours and change them any time. New production entries use the new values; old entries keep the values they were saved with.</p>
 ${[].map(z=>`<div class="f" style="margin-bottom:8px"><div><label>${z} inch: bricks (N)</label><input type="number" id="n${z}" value="${s.rec[z].n}"></div><div><label>Cement bags</label><input type="number" id="c${z}" step="any" value="${s.rec[z].c}"></div><div><label>Granite metal bags</label><input type="number" id="m${z}" step="any" value="${s.rec[z].m}"></div><div><label>Granite sand bags</label><input type="number" id="s${z}" step="any" value="${s.rec[z].s}"></div></div>`).join('')}
 <button class="b" onclick="saveSet()">Save settings</button> <span class="k">Changes apply to new entries only.</span></div>
 <div class="cd"><h2>Brick sizes and work types</h2><p class="k">Add any new brick size or other work you pay workers for. <b>Brick</b> types can be sold and use cement, metal and sand. <b>Work</b> types are only paid to workers (no materials, no sales).</p>
 ${tbl(['Name','Type','Pay per unit','Selling price',''],T().map(t=>row([`<input value="${esc(t.name)}" onchange="updT('${t.id}','name',this.value)">`,t.kind=='brick'?'Brick':'Work',`<input type="number" step="any" value="${t.wage}" onchange="updT('${t.id}','wage',this.value)">`,t.kind=='brick'?`<input type="number" step="any" value="${t.price}" onchange="updT('${t.id}','price',this.value)">`:'\u2014',`<button class="s" onclick="delT('${t.id}')">\u2715</button>`])).join(''))}
 <div class="f"><div><label>New name</label><input id="tn" placeholder="e.g. 8 inch brick"></div><div><label>Type</label><select id="tk"><option value="brick">Brick (sold)</option><option value="work">Other work (paid only)</option></select></div><div><label>Pay per unit</label><input type="number" id="tw" step="any"></div><div><label>Selling price (bricks)</label><input type="number" id="tp" step="any"></div><button class="b" onclick="addT()">Add</button></div><p class="k">Changes to pay or price apply to new entries only; old entries keep what they were saved with. Edits here save automatically.</p></div>
 <div class="cd"><h2>Vendors</h2><div class="f"><div><label>Vendor name</label><input id="vn"></div><div><label>Supplies</label><div>${MAT.map(([k,n])=>`<label style="display:inline-flex;gap:4px;margin-right:10px;color:var(--tx);font-size:14px"><input type="checkbox" class="vc" value="${k}" style="width:auto">${n}</label>`).join('')}</div></div><button class="b" onclick="addVendor()">Add vendor</button></div>${tbl(['Vendor','Supplies',''],S.vendors.map(v=>row([esc(v.name),v.mats.map(k=>MAT.find(x=>x[0]==k)[1]).join(', '),delB('vendors',v.id)])).join(''))}<p class="k">Weekly payments and balances per vendor are in the Vendors tab.</p></div>
 <div class="cd"><h2>Backup</h2><p class="k">Your data is stored in the cloud database and shared by everyone who signs in. This text is a safety copy; restoring it replaces all current data.</p>
 <textarea id="bk" rows="4">${esc(JSON.stringify(S))}</textarea><p><button class="b" onclick="restore()">Restore from text</button></p></div>`}};

const sh=p=>p.qty/(p.emps||[p.emp]).length;
const UN={c:'bags',m:'cu ft',s:'cu ft'};
const bk=n=>n*S.set.bk/28.3168;
const chk=(c,n)=>`<label style="display:inline-flex;gap:5px;align-items:center;margin:0 12px 6px 0;font-size:14px;color:var(--tx)"><input type="checkbox" class="${c}" value="${esc(n)}" style="width:auto">${esc(n)}</label>`;
V.prod=function(){
 const rows=[...S.prod].sort((a,b)=>b.date<a.date?-1:1).slice(0,40).map(p=>row([p.date,(p.grp?'👥 '+esc(p.grp)+': ':'')+esc((p.emps||[p.emp]).join(', ')),esc(p.sn||TN(p.size))+(p.note?' <span class="mu">('+esc(p.note)+')</span>':''),q(p.qty),q(p.u.c),q(p.u.m)+(p.bu?' ('+q(p.bu.m)+' bkt)':''),q(p.u.s)+(p.bu?' ('+q(p.bu.s)+' bkt)':''),m(p.qty*p.rate),delB('prod',p.id)],['','','','r','r','r','r','r'])).join('');
 const gl=S.groups.map(g=>row([esc(g.name),esc(g.members.join(', ')),delB('groups',g.id)])).join('');
 return `<div class="cd"><h2>Daily production entry</h2>${S.emp.length?`<label>Workers (tick, or tap a group)</label><div style="margin-bottom:6px">${S.groups.map(g=>`<button class="s" onclick="pickG('${g.id}')">👥 ${esc(g.name)}</button> `).join('')}<button class="s" onclick="clrG()">Individuals</button> <span id="pgl" class="k">${pgTxt()}</span></div><div>${S.emp.map(n=>chk('pc',n)).join('')}</div>
 <div class="f"><div><label>Date</label><input type="date" id="pd" value="${today()}"></div>
 <div><label>Brick size / work</label><select id="ps" onchange="prT()">${T().map(t=>`<option value="${t.id}">${esc(t.name)}${t.kind=='work'?' (work)':''}</option>`).join('')}</select></div>
 <div><label>Quantity (bricks or work units)</label><input type="number" id="pq" min="0"></div>
 <div><label>Cement bags used (bricks only)</label><input type="number" id="pcm" step="any" oninput="pv()"></div>
 <div><label>Granite metal – buckets used</label><input type="number" id="pmm" step="any" oninput="this.dataset.d=this.value===''?'':1;pv()"></div>
 <div><label>Granite sand – buckets used</label><input type="number" id="pss" step="any" oninput="this.dataset.d=this.value===''?'':1;pv()"></div>
 <div><label>Pay per unit (override)</label><input type="number" id="pr" step="any" placeholder="${T()[0]?T()[0].wage:''}"></div><button class="b" onclick="addProd()">Add</button></div>
 <p class="k" id="pv">Defaults: 1 cement bag = ${S.set.rm} bucket(s) of metal (${bk(S.set.rm).toFixed(2)} cu ft) + ${S.set.rs} bucket(s) of sand (${bk(S.set.rs).toFixed(2)} cu ft); 1 bucket = ${S.set.bk} L = ${(S.set.bk/28.3168).toFixed(2)} cu ft. The bucket boxes fill in automatically from the cement bags — change them if that day was different. Defaults are set in Settings. Wage is split equally among the selected workers.</p><p><button class="s" onclick="quickT()">+ New brick size or work type</button> <span class="k">Pay and prices for every type are in Settings. Add a note below if useful.</span></p><div class="f"><div><label>Note (optional)</label><input id="pnote" placeholder="e.g. stacking, cleaning"></div></div>`:`<p class="mu">Add workers first in the Weekly payroll tab.</p>`}</div>
 <div class="cd"><h2>Worker groups</h2>${S.emp.length?`<div class="f"><div><label>Group name</label><input id="gname" placeholder="e.g. Team A"></div><button class="b" onclick="saveGroup()">Save group</button></div><div style="margin-top:8px">${S.emp.map(n=>chk('gc',n)).join('')}</div>`:''}${tbl(['Group','Members',''],gl)}</div>
 <div class="cd"><h2>Recent production</h2>${tbl(['Date','Workers','Size','Bricks','Cement (bags)','Metal (cu ft)','Sand (cu ft)','Wage',''],rows)}</div>`};
function pv(){const c=num('pcm');[['pmm',S.set.rm],['pss',S.set.rs]].forEach(([id,k])=>{const e=$(id);if(!e.dataset.d)e.value=c?+(c*k).toFixed(2):''});
 const a=num('pmm'),b=num('pss');$('pv').textContent=c?'Using '+q(a)+' buckets metal ('+q(bk(a))+' cu ft) and '+q(b)+' buckets sand ('+q(bk(b))+' cu ft) for '+q(c)+' cement bags. 1 bucket = '+S.set.bk+' L = '+(S.set.bk/28.3168).toFixed(2)+' cu ft.':'Enter the cement bags used and the metal and sand buckets fill in from your defaults.'}
let pg='';const pgTxt=()=>pg?'\u2192 Pay goes to the group: '+pg:'\u2192 Pay goes to the individual workers ticked';
function clrG(){pg='';$('pgl').textContent=pgTxt()}
function pickG(id){const g=S.groups.find(x=>x.id==id);document.querySelectorAll('.pc').forEach(c=>c.checked=g.members.includes(c.value));pg=g.name;$('pgl').textContent=pgTxt()}
function saveGroup(){const n=val('gname').trim(),mb=[...document.querySelectorAll('.gc:checked')].map(c=>c.value);if(!n||!mb.length)return alert('Enter a group name and tick its workers');S.groups.push({id:uid(),name:n,members:mb});save();render()}
const SN={c:'cement',m:'metal',s:'sand'};
let vw=mon(today());
const vNames=()=>[...new Set([...S.vendors.map(v=>v.name),...S.pur.map(p=>p.vendor).filter(Boolean)])];
const vBought=n=>sum(S.pur.filter(p=>p.vendor==n),p=>p.cost),vPaid=n=>sum(S.vp.filter(p=>p.vendor==n),p=>p.amt),vOwed=()=>sum(vNames(),n=>vBought(n)-vPaid(n));
const uOpts=k=>k=='c'?[['bag','Bags']]:[['load','Loads (truck)'],['ft','Cubic feet'],['bkt','Buckets']];
const vOpts=k=>[...S.vendors.filter(x=>x.mats.includes(k)).map(x=>x.name),'Other / not listed'].map(n=>`<option>${esc(n)}</option>`).join('');
const toBase=(k,u,n,lc)=>k=='c'?n:u=='load'?n*lc:u=='bkt'?bk(n):n;
function uChg(){const k=val('um');$('uu').innerHTML=uOpts(k).map(([a,b])=>`<option value="${a}">${b}</option>`).join('');$('uv').innerHTML=vOpts(k);if(k!='c')$('ulc').value=S.set.lc[k];uPv()}
function uPv(){const k=val('um'),u=val('uu'),n=num('uq'),ld=k!='c'&&u=='load';$('ulw').style.display=ld?'':'none';const b=toBase(k,u,n,num('ulc'));$('upv').textContent=n?'= '+q(b)+' '+UN[k]+(k!='c'?' (about '+q(b*28.3168/S.set.bk)+' buckets)':''):''}
function addPur(){const k=val('um'),u=val('uu'),n=num('uq'),lc=num('ulc');if(!n)return alert('Enter quantity');if(k!='c'&&u=='load'&&lc<=0)return alert('Enter the cubic feet in this load');
 S.pur.push(Object.assign({id:uid(),date:val('ud'),mat:k,vendor:val('uv'),qty:toBase(k,u,n,lc),cost:num('uc'),en:n,eu:u},k!='c'&&u=='load'?{lc}:{}));save();render()}
function addVendor(){const n=val('vn').trim(),mt=[...document.querySelectorAll('.vc:checked')].map(c=>c.value);if(!n||!mt.length)return alert('Enter vendor name and tick what they supply');S.vendors.push({id:uid(),name:n,mats:mt});save();render()}
function payV(n,b){const a=parseFloat(prompt('Pay '+n+' (balance '+b+')',b));if(a>0){S.vp.push({id:uid(),vendor:n,date:today(),amt:a});save();render()}}
V.stock=function(){const st=stock(),U=(P,k)=>sum(P,p=>p.u[k]||0),bu=x=>x*28.3168/S.set.bk,gx=(k,v)=>q(v)+' ('+q(bu(v))+' bkt)';
 const ent=p=>!p.en?'\u2014':p.eu=='load'?q(p.en)+' loads \u00d7 '+q(p.lc)+' cu ft':q(p.en)+' '+({bag:'bags',ft:'cu ft',bkt:'buckets',load:'loads'})[p.eu];
 const hist=[...S.pur].sort((a,b)=>b.date<a.date?-1:1).slice(0,30).map(p=>row([p.date,MAT.find(x=>x[0]==p.mat)[1],esc(p.vendor),ent(p),q(p.qty)+' '+UN[p.mat],m(p.cost),m(p.qty?p.cost/p.qty:0),delB('pur',p.id)],['','','','r','r','r','r'])).join('');
 const dr=Array.from({length:14},(_,i)=>addD(today(),-i)).map(d=>{const P=S.prod.filter(p=>p.date==d);return row([d,q(sum(P.filter(p=>p.k!='work'),p=>p.qty)),q(U(P,'c')),gx('m',U(P,'m')),gx('s',U(P,'s'))],['','r','r','r','r'])}).join('');
 const mr=[...new Set(S.prod.map(p=>p.date.slice(0,7)))].sort().reverse().slice(0,12).map(x=>{const P=S.prod.filter(p=>p.date.slice(0,7)==x),dn=new Set(P.map(p=>p.date)).size||1,c=U(P,'c'),me=U(P,'m'),sa=U(P,'s'),br=sum(P.filter(p=>p.k!='work'),p=>p.qty);
  return row([x,dn,q(br),q(c),gx('m',me),gx('s',sa),q(c/dn)+' bags \u00b7 '+q(me/dn)+' \u00b7 '+q(sa/dn)+' cu ft',c?q(br/c):'\u2014'],['','r','r','r','r','r','r','r'])}).join('');
 return `<div class="cd"><h2>Current stock</h2>${tbl(['Material','Received','Used','In stock','Avg cost/unit','Avg use/day (14 d)','Days left','Suggested order'],MAT.map(([k,n])=>{const x=st[k];return row([n+' ('+UN[k]+')',q(x.b),q(x.u),`<b>${q(x.left)}</b>`+(k=='c'?'':' ('+q(bu(x.left))+' bkt)'),m(x.avg),q(x.use),x.dl===null?'\u2014':q(Math.max(x.dl,0)),(()=>{const nd=x.use*S.set.oc-x.left;return x.use>0&&nd>0?(k=='c'?q(Math.ceil(nd))+' bags':q(nd)+' cu ft (\u2248 '+q(nd/S.set.lc[k])+' loads)'):'\u2014'})()],['','r','r','r','r','r',x.low?'bad':'',''])}).join(''))}
 <p class="k">Cement is counted in bags. Granite metal and sand are counted in cubic feet (cu ft); bkt = ${S.set.bk} litre buckets. Reminder triggers when stock will last ${S.set.warn} days or less. Suggested order = average daily use × ${S.set.oc} days − stock in hand (loads use your default cu ft per load).</p></div>
 <div class="cd"><h2>Record purchase</h2><div class="f"><div><label>Date</label><input type="date" id="ud" value="${today()}"></div>
 <div><label>Material</label><select id="um" onchange="uChg()">${MAT.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div>
 <div><label>Vendor</label><select id="uv">${vOpts('c')}</select></div>
 <div><label>Quantity</label><input type="number" id="uq" step="any" oninput="uPv()"></div>
 <div><label>Measured in</label><select id="uu" onchange="uPv()">${uOpts('c').map(([a,b])=>`<option value="${a}">${b}</option>`).join('')}</select></div>
 <div id="ulw" style="display:none"><label>Cubic feet in 1 load</label><input type="number" id="ulc" step="any" value="${S.set.lc.m}" oninput="uPv()"></div>
 <div><label>Total cost</label><input type="number" id="uc" step="any"></div><button class="b" onclick="addPur()">Add</button></div>
 <p class="k" id="upv"></p><p class="k">For sand and metal choose Loads and enter how many cubic feet that truck load had (each load can differ). You can also enter cubic feet or buckets directly. To correct stock after a physical count, add a negative quantity with cost 0.</p></div>
 <div class="cd"><h2>Daily usage (last 14 days)</h2>${tbl(['Date','Bricks','Cement (bags)','Granite metal (cu ft)','Granite sand (cu ft)'],dr)}<p class="k">Usage comes from the cement bags you enter in Production, with metal and sand deducted by your per-bag bucket ratio.</p></div>
 <div class="cd"><h2>Monthly usage</h2>${tbl(['Month','Days worked','Bricks','Cement (bags)','Granite metal (cu ft)','Granite sand (cu ft)','Avg per working day','Bricks per cement bag'],mr)}</div>
 <div class="cd"><h2>Purchase history</h2>${tbl(['Date','Material','Vendor','Entered','Stock qty','Cost','Per unit',''],hist)}</div>`};
V.ven=function(){const a=vw,b=addD(vw,6),names=vNames();let wt=0;
 const rows=names.map(n=>{const P=S.pur.filter(p=>p.vendor==n&&inR(p.date,a,b)),ds=MAT.map(([k])=>{const x=sum(P.filter(p=>p.mat==k),p=>p.qty);return x>0?q(x)+' '+UN[k]+' '+SN[k]:''}).filter(Boolean).join(', ')||'—';
  const wc=sum(P,p=>p.cost),wp=sum(S.vp.filter(p=>p.vendor==n&&inR(p.date,a,b)),p=>p.amt),ow=vBought(n)-vPaid(n);wt+=wc;
  return row([esc(n),ds,m(wc),m(wp),`<b class="${ow>0.005?'wn':'ok'}">${m(ow)}</b>`,ow>0.005?`<button class="s" data-n="${esc(n)}" onclick="payV(this.dataset.n,${ow})">Pay</button>`:''],['','','r','r','r'])}).join('');
 const dl=S.pur.filter(p=>inR(p.date,a,b)).sort((x,y)=>x.date<y.date?-1:1).map(p=>row([p.date,esc(p.vendor),MAT.find(x=>x[0]==p.mat)[1],q(p.qty)+' '+UN[p.mat],m(p.cost)],['','','','r','r'])).join('');
 const ph=[...S.vp].sort((x,y)=>y.date<x.date?-1:1).slice(0,30).map(p=>row([p.date,esc(p.vendor),m(p.amt),delB('vp',p.id)],['','','r'])).join('');
 return `<div class="cd"><h2>Vendor payments</h2><div class="f"><div><label>Week starting (Monday)</label><input type="date" value="${vw}" onchange="vw=mon(this.value);render()"></div></div><p class="k">Week: ${a} to ${b}. Balance = everything received from the vendor minus everything you have paid.</p>
 ${tbl(['Vendor','Received this week','Bill this week','Paid this week','Total balance to pay',''],rows)}<p><b>This week’s bills: ${m(wt)} · Total owed to all vendors: ${m(vOwed())}</b></p></div>
 <div class="cd"><h2>This week’s deliveries</h2>${tbl(['Date','Vendor','Material','Quantity','Cost'],dl)}</div>
 <div class="cd"><h2>Payments made</h2>${tbl(['Date','Vendor','Amount',''],ph)}</div>`};
const cvTxt=(l,rm,rs)=>{const b=(+l||0)/28.3168;return '1 bucket = '+(+l||0)+' litres = '+b.toFixed(2)+' cu ft. 1 cement bag uses '+(+rm||0)+' bucket(s) of metal = '+((+rm||0)*b).toFixed(2)+' cu ft and '+(+rs||0)+' bucket(s) of sand = '+((+rs||0)*b).toFixed(2)+' cu ft.'};
function cvt(){$('cvt').innerHTML='<b>'+cvTxt(num('s_bk'),num('s_rm'),num('s_rs'))+'</b>'}
V.pay=function(){const e=wk,f=addD(wk,6);let tot=0,due=0;
 const gn=[...new Set([...S.groups.map(g=>g.name),...S.prod.map(p=>p.grp).filter(Boolean),...S.sales.flatMap(ldrs).filter(x=>x.startsWith('G:')).map(x=>x.slice(2))])];
 const wn=[...new Set([...S.emp,...S.prod.filter(p=>!p.grp).flatMap(p=>p.emps||[p.emp]),...S.sales.flatMap(ldrs).filter(x=>!x.startsWith('G:'))])];
 const paidOf=k=>sum(S.wp.filter(w=>w.emp==k&&w.week==e),w=>w.amt);
 const bal=(v,k)=>{const b=v-paidOf(k);tot+=v;if(b>0)due+=b;return b};
 const btn=(k,b,al)=>b>0.005||al?`<button class="s" data-n="${esc(k)}" onclick="payW(this.dataset.n,${b})">Pay</button>`:'';
 const st=(b,v,pd)=>b>0.005?`<span class="wn">${m(b)}</span>`:b<-0.005?`<span class="ok">Advance ${m(-b)}</span>`:(v||pd)?'<span class="ok">Settled</span>':'<span class="mu">No work this week</span>';
 const gr=gn.map(n=>{const k='G:'+n,g=S.groups.find(x=>x.name==n),mc=g?g.members.length:0,P=S.prod.filter(p=>p.grp==n&&inR(p.date,e,f)),L=S.sales.filter(x=>ldrs(x).includes(k)&&inR(x.date,e,f)),pw=sum(P,p=>p.qty*p.rate),lw=sum(L,x=>x.loaded*x.lrate/ldrs(x).length),b=bal(pw+lw,k);
  return row(['\ud83d\udc65 '+esc(n),mc||'\u2014',q(sum(P,p=>p.qty)),m(pw),q(sum(L,x=>x.loaded/ldrs(x).length)),m(lw),`<b>${m(pw+lw)}</b>`,mc?m((pw+lw)/mc):'\u2014',m(paidOf(k)),st(b,pw+lw,paidOf(k)),btn(k,b,1)],['','r','r','r','r','r','r','r','r','r',''])}).join('');
 const wr=wn.map(n=>{const P=S.prod.filter(p=>!p.grp&&(p.emps||[p.emp]).includes(n)&&inR(p.date,e,f)),L=S.sales.filter(x=>ldrs(x).includes(n)&&inR(x.date,e,f)),pw=sum(P,p=>sh(p)*p.rate),lw=sum(L,x=>x.loaded*x.lrate/ldrs(x).length),b=bal(pw+lw,n);if(!(pw+lw)&&!paidOf(n))return '';
  return row([esc(n),q(sum(P,sh)),m(pw),q(sum(L,x=>x.loaded/ldrs(x).length)),m(lw),`<b>${m(pw+lw)}</b>`,m(paidOf(n)),st(b,pw+lw,paidOf(n)),btn(n,b)],['','r','r','r','r','r','r','r',''])}).join('');
 const ph=[...S.wp].sort((a,b)=>b.date<a.date?-1:1).slice(0,40).map(w=>row([w.date,esc(w.emp.replace(/^G:/,'\ud83d\udc65 ')),w.week,m(w.amt),delB('wp',w.id)],['','','','r',''])).join('');
 return `<div class="cd"><h2>Weekly pay</h2><div class="f"><div><label>Week starting (Monday)</label><input type="date" id="wk" value="${wk}" onchange="wk=mon(this.value);render()"></div>
 <div><label>Add worker</label><input id="en" placeholder="Name"></div><button class="b" onclick="addEmp()">Add worker</button></div>
 <p class="k">Week: ${e} to ${f}. Pay = bricks \u00d7 rate at the time + bricks loaded \u00d7 loading rate. Work entered for a <b>group</b> is paid to the group as a whole; work entered for ticked individuals is paid to those workers.</p></div>
 <div class="cd"><h2>Pay a group or worker</h2><div class="f"><div><label>Pay to</label><select id="wpy">${gn.length?`<optgroup label="Groups">${gn.map(n=>`<option value="G:${esc(n)}">\ud83d\udc65 ${esc(n)}</option>`).join('')}</optgroup>`:''}<optgroup label="Individuals">${S.emp.map(n=>`<option>${esc(n)}</option>`).join('')}</optgroup></select></div><div><label>Amount</label><input type="number" id="wpa" step="any"></div><div><label>Payment date</label><input type="date" id="wpd" value="${today()}"></div><button class="b" onclick="payNow()">Record payment</button></div><p class="k">Recorded against the week shown above (${e} to ${f}). Use it for advances or part payments; the balances below update. If a group shows "No work this week", no production or loading was saved for that group in this week \u2013 check the week date above.</p></div>
 <div class="cd"><h2>Group pay</h2>${tbl(['Group','Members','Bricks / units','Production pay','Loaded','Loading pay','Total','Per member (equal)','Paid','Balance',''],gr)}</div>

V.pnl=function(){const a=pm+'-01',b=pm+'-31',x=pnl(a,b),r=recv(),Lr=(n,v,c)=>row([n,m(v)],['',(c||'')+' r']);
 const rc=sum(S.pay.filter(p=>inR(p.date,a,b)),p=>p.amt),wpm=S.wp.filter(w=>inR(w.date,a,b)),wpd=sum(wpm,w=>w.amt),vpm=sum(S.vp.filter(v=>inR(v.date,a,b)),v=>v.amt),by={};
 wpm.forEach(w=>by[w.emp]=(by[w.emp]||0)+w.amt);
 const unp=sum(S.prod,p=>p.qty*p.rate)+sum(S.sales,x=>x.loaded*x.lrate)-sum(S.wp,w=>w.amt),cash=rc-wpd-vpm-x.ex;
 return `<div class="cd"><h2>Profit & loss</h2><div class="f"><div><label>Month</label><input type="month" id="pmn" value="${pm}" onchange="pm=this.value;render()"></div></div>
 <div class="sc"><table>${Lr('Sales invoiced ('+q(x.sold)+' bricks)',x.rev,'ok')}${row(['<b>Direct costs</b>',''])}${Lr('Raw materials used ('+q(x.bricks)+' bricks made)',-x.mat)}${Lr('Production pay (groups and workers)',-x.pw)}${Lr('Loading pay',-x.lw)}
 ${Lr('<b>Gross profit</b>',x.rev-x.mat-x.pw-x.lw)}${row(['<b>Other expenses</b>',''])}${Object.entries(x.cats).map(([c,v])=>Lr(esc(c),-v)).join('')||row(['<span class="mu">none</span>',''])}
 ${Lr('<b>NET PROFIT</b>',x.net,x.net<0?'bad':'ok')}</table></div>
 <p class="k">Profit counts what was sold, produced and used in the month, whether or not it has been paid yet. Raw materials are costed at your average purchase price for the quantity used, so vendor payments are shown separately below, not deducted twice.</p></div>
 <div class="cd"><h2>Payments this month (cash)</h2><div class="sc"><table>${Lr('Received from customers',rc,'ok')}${Lr('Wages paid',-wpd)}${Object.entries(by).map(([k,v])=>row(['\u00a0\u00a0'+esc(k.replace(/^G:/,'\ud83d\udc65 ')),m(v)],['mu','mu r'])).join('')}${Lr('Paid to vendors (raw materials)',-vpm)}${Lr('Other expenses',-x.ex)}${Lr('<b>Net cash movement</b>',cash,cash<0?'bad':'ok')}</table></div></div>
 <div class="cd"><h2>Still pending (all time)</h2><div class="sc"><table>${Lr('Customers still owe you',sum(r,y=>y.bal),'wn')}${Lr('Wages earned but not yet paid',unp,'wn')}${Lr('You still owe vendors',vOwed(),'wn')}</table></div></div>`};
const ldrs=x=>x.loaders||(x.loader?[x.loader]:[]);
const ldsel=()=>[...document.querySelectorAll('.lg:checked,.li:checked')].map(c=>c.value);
const chk2=(c,v,l)=>`<label style="display:inline-flex;gap:5px;align-items:center;margin:0 12px 6px 0;font-size:14px;color:var(--tx)"><input type="checkbox" class="${c}" value="${esc(v)}" style="width:auto">${esc(l)}</label>`;
const T=()=>S.set.types||[{id:'4',name:'4 inch brick',kind:'brick',wage:S.set.w4,price:S.set.p4},{id:'6',name:'6 inch brick',kind:'brick',wage:S.set.w6,price:S.set.p6}];
const TN=id=>{const t=T().find(x=>x.id==id);return t?t.name:(/^\d+$/.test(String(id))?id+' inch brick':String(id))};
const TB=()=>T().filter(t=>t.kind=='brick');
function updT(id,k,v){S.set.types=T().map(t=>t.id==id?Object.assign({},t,{[k]:k=='name'?v:(+v||0)}):t);save()}
function addT(){const n=val('tn').trim();if(!n)return alert('Enter a name');S.set.types=[...T(),{id:'t'+uid(),name:n,kind:val('tk'),wage:num('tw'),price:num('tp')}];save();render()}
function delT(id){if(confirm('Remove this type from the lists? Old entries keep their name.')){S.set.types=T().filter(t=>t.id!=id);save();render()}}
function quickT(){const n=(prompt('Name of the new brick size or work (e.g. 8 inch brick, Stacking, Cleaning)')||'').trim();if(!n)return;
 const br=confirm('Is this a BRICK you make and sell?\nOK = brick, Cancel = other work (paid only)'),w=parseFloat(prompt('Pay per unit for the workers','1'))||0,pr=br?(parseFloat(prompt('Default selling price per brick','0'))||0):0,id='t'+uid();
 S.set.types=[...T(),{id,name:n,kind:br?'brick':'work',wage:w,price:pr}];save();softRender();$('ps').value=id;prT()}
function prT(){const t=T().find(x=>x.id==val('ps'));if(t)$('pr').placeholder=t.wage}
function addProd(){const em=[...document.querySelectorAll('.pc:checked')].map(c=>c.value),z=val('ps'),t=T().find(x=>x.id==z)||{name:TN(z),kind:'brick',wage:0},wkn=t.kind=='work',qt=num('pq'),cm=num('pcm');
 if(!em.length)return alert('Select at least one worker');if(qt<=0)return alert('Enter the quantity');if(!wkn&&cm<=0)return alert('Enter cement bags used');
 const bm=wkn?0:val('pmm')!==''?num('pmm'):cm*S.set.rm,bs=wkn?0:val('pss')!==''?num('pss'):cm*S.set.rs;
 S.prod.push(Object.assign({id:uid(),date:val('pd'),emps:em,emp:em.join(', '),size:z,sn:t.name,qty:qt,rate:val('pr')!==''?num('pr'):t.wage,u:wkn?{c:0,m:0,s:0}:{c:cm,m:bk(bm),s:bk(bs)},grp:pg||((S.groups.find(g=>g.members.length==em.length&&g.members.every(x=>em.includes(x)))||{}).name||''),note:val('pnote')||''},wkn?{k:'work'}:{bu:{m:bm,s:bs,l:S.set.bk}}));pg='';save();render()}
function sl(){const t=sum(TB(),b=>num('q_'+b.id)*num('r_'+b.id));$('st').value=t;$('sload').placeholder=sum(TB(),b=>num('q_'+b.id))}
function addSale(){const it=TB().map(b=>({size:b.id,name:b.name,qty:num('q_'+b.id),rate:num('r_'+b.id)})).filter(i=>i.qty>0);
 if(!it.length||!val('sc').trim())return alert('Enter customer and quantity');const tot=sum(it,i=>i.qty*i.rate),qt=sum(it,i=>i.qty),id=uid();
 const no='INV-'+String(1+Math.max(0,...S.sales.map(x=>parseInt(String(x.no).replace(/\D/g,''))||0))).padStart(4,'0');
 S.sales.push({id,no,date:val('sd'),cust:val('sc').trim(),phone:val('sp'),items:it,total:tot,loaded:val('sload')!==''?num('sload'):qt,loaders:ldsel(),loader:ldsel()[0]||'',lrate:S.set.load,due:val('sf')});
 if(num('sa')>0)S.pay.push({id:uid(),sid:id,date:val('sd'),amt:Math.min(num('sa'),tot)});save();render();inv(id)}
V.sales=function(){const r=recv(),t=today();
 const rr=r.map(x=>row([x.s.no,esc(x.s.cust),esc(x.s.phone||''),m(x.s.total),m(x.bal),x.s.due||'\u2014',`<button class="s" onclick="rcv('${x.s.id}')">Receive</button>`],['','','','r','r',x.s.due&&x.s.due<=t?'bad':''])).join('');
 const li=[...S.sales].sort((a,b)=>b.date<a.date?-1:1).slice(0,40).map(s=>{const b=s.total-paid(s.id);return row([s.no,s.date,esc(s.cust),esc(ldrs(s).map(z=>z.replace(/^G:/,'\ud83d\udc65 ')).join(', ')||'\u2014'),q(sum(s.items,i=>i.qty)),m(s.total),b>0.005?`<span class="wn">${m(b)}</span>`:'<span class="ok">Paid</span>',`<button class="s" onclick="inv('${s.id}')">Invoice</button> ${delB('sales',s.id)}`],['','','','','r','r','r'])}).join('');
 return `<div class="cd"><h2>New sale / invoice</h2><div class="f"><div><label>Date</label><input type="date" id="sd" value="${t}"></div>
 <div><label>Customer</label><input id="sc"></div><div><label>Phone</label><input id="sp"></div></div>
 <div class="f" style="margin-top:10px">${TB().map(b=>`<div><label>${esc(b.name)} \u2013 qty</label><input type="number" id="q_${b.id}" oninput="sl()"></div><div><label>${esc(b.name)} \u2013 rate</label><input type="number" id="r_${b.id}" step="any" value="${b.price}" oninput="sl()"></div>`).join('')}</div>
 <div class="f" style="margin-top:10px"><div><label>Total</label><input id="st" disabled></div><div><label>Paid now (0 = credit)</label><input type="number" id="sa" step="any" value="0"></div>
 <div><label>Follow-up date (if balance)</label><input type="date" id="sf"></div>
 <div><label>Loaded on truck (bricks)</label><input type="number" id="sload"></div></div><div style="margin-top:10px"><label>Loaded by \u2013 tick the team(s) and/or the people who loaded (loading pay is split equally between the ticked items)</label>${S.groups.length?`<div>${S.groups.map(g=>chk2('lg','G:'+g.name,'\ud83d\udc65 '+g.name)).join('')}</div>`:''}<div>${S.emp.map(n=>chk2('li',n,n)).join('')}</div></div>
 <p><button class="b" onclick="addSale()">Save sale</button></p></div>
 <div class="cd"><h2>Payments to follow up</h2>${tbl(['Invoice','Customer','Phone','Total','Balance','Follow-up',''],rr)}</div>
 <div class="cd"><h2>Invoices</h2>${tbl(['No.','Date','Customer','Loaded by','Bricks','Total','Status',''],li)}</div>`};
/* ---- actions ---- */
function addEmp(){const n=val('en').trim();if(n&&!S.emp.includes(n)){S.emp.push(n);save();render()}}
function rmEmp(n){if(confirm('Remove '+n+' from list? Past records stay.')){S.emp=S.emp.filter(x=>x!=n);save();render()}}
function rcv(id){const s=S.sales.find(x=>x.id==id),b=s.total-paid(id),a=parseFloat(prompt('Amount received from '+s.cust+' (balance '+b+')',b));
 if(a>0){S.pay.push({id:uid(),sid:id,date:today(),amt:a});const nb=b-a;if(nb>0.005){const d=prompt('Next follow-up date (YYYY-MM-DD)',s.due||'');if(d)s.due=d}save();render()}}
function payNow(){const k=val('wpy'),a=num('wpa');if(!k||a<=0)return alert('Choose who to pay and enter the amount');S.wp.push({id:uid(),emp:k,week:wk,date:val('wpd'),amt:a});save();render()}
function payW(n,b){const a=parseFloat(prompt('Pay '+n.replace(/^G:/,'group ')+' (balance '+Math.max(b,0)+')',b>0?b:''));if(a>0){S.wp.push({id:uid(),emp:n,week:wk,date:today(),amt:a});save();render()}}
function addExp(){if(!num('xa')||!val('xc').trim())return alert('Enter category and amount');S.exp.push({id:uid(),date:val('xd'),cat:val('xc').trim(),amt:num('xa'),note:val('xn')});save();render()}
function saveSet(){const s=S.set;s.biz=val('s_biz');s.cur=val('s_cur');['load','warn'].forEach(k=>s[k]=num('s_'+k));
 s.oc=num('s_oc')||7;s.bk=num('s_bk')||15;s.rm=num('s_rm');s.rs=num('s_rs');s.lc={m:num('s_lm')||1,s:num('s_ls')||1};save();render();alert('Saved')}
function restore(){try{const x=JSON.parse(val('bk'));if(!x.set)throw 0;if(confirm('Replace ALL data in the cloud database with this backup?')){S=Object.assign(structuredClone(D),x);S.set=Object.assign({},D.set,S.set);save();render()}}catch(e){alert('That backup text is not valid')}}
function inv(id){const s=S.sales.find(x=>x.id==id),p=paid(id),M=$('modal');
 M.innerHTML=`<div><h2 style="margin:0">${esc(S.set.biz)}</h2><div style="color:#666">Invoice ${s.no} · ${s.date}</div><p><b>${esc(s.cust)}</b><br>${esc(s.phone||'')}</p>
 <table style="width:100%;border-collapse:collapse"><tr><th align="left">Item</th><th align="right">Qty</th><th align="right">Rate</th><th align="right">Amount</th></tr>
 ${s.items.map(i=>`<tr><td>${esc(i.name||TN(i.size))}</td><td align="right">${i.qty}</td><td align="right">${m(i.rate)}</td><td align="right">${m(i.qty*i.rate)}</td></tr>`).join('')}
 <tr><td colspan="3" align="right"><b>Total</b></td><td align="right"><b>${m(s.total)}</b></td></tr><tr><td colspan="3" align="right">Paid</td><td align="right">${m(p)}</td></tr>
 <tr><td colspan="3" align="right"><b>Balance</b></td><td align="right"><b>${m(s.total-p)}</b></td></tr></table>
 <p class="nob"><button class="b" onclick="print()">Print</button> <button class="s" onclick="$('modal').style.display='none'">Close</button></p></div>`;M.style.display='flex'}
render();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const E=id=>document.getElementById(id),cfg=window.FIREBASE_CONFIG;
if(!cfg||String(cfg.apiKey).startsWith('PASTE')){E('lerr').textContent='Setup needed: paste your Firebase config at the top of this file.';window.doLogin=window.doReset=()=>{}}
else{
const app=initializeApp(cfg),auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()}),ignoreUndefinedProperties:true});
const COLS=window.COLS,P=c=>'units/main/'+c,synced={};
const J=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a<b?-1:a>b?1:0)):v);
let cfgJ='',unsubs=[];
let lastErr=0;const err=e=>{console.error(e);if(Date.now()-lastErr<3000)return;lastErr=Date.now();alert(e&&e.code==='permission-denied'?'Permission denied: your Firestore rules are not published, or this email is not allowed. Data was NOT saved.':'Cloud error: '+(e&&e.code||'')+' '+(e&&e.message||e))};
window.cloudPush=()=>{const S=window.getS();
 COLS.forEach(c=>{const mp=synced[c]||(synced[c]=new Map()),cur=new Set();
  (S[c]||[]).forEach(x=>{cur.add(x.id);const j=J(x);if(mp.get(x.id)!==j){mp.set(x.id,j);setDoc(doc(db,P(c),x.id),x).catch(err)}});
  [...mp.keys()].forEach(id=>{if(!cur.has(id)){mp.delete(id);deleteDoc(doc(db,P(c),id)).catch(err)}})});
 const cj=J({set:S.set,emp:S.emp});if(cj!==cfgJ){cfgJ=cj;setDoc(doc(db,'units/main/meta/config'),{set:S.set,emp:S.emp}).catch(err)}};
function start(){
 COLS.forEach(c=>{synced[c]=new Map();unsubs.push(onSnapshot(collection(db,P(c)),snap=>{const a=[],mp=new Map();
  snap.forEach(d=>{const x=d.data();x.id=d.id;a.push(x);mp.set(d.id,J(x))});synced[c]=mp;window.getS()[c]=a;if(!snap.metadata.hasPendingWrites)window.softRender()},err))});
 unsubs.push(onSnapshot(doc(db,'units/main/meta/config'),d=>{const S=window.getS();
  if(d.exists()){const x=d.data();S.set=Object.assign({},window.DSET,x.set||{});S.emp=x.emp||[];cfgJ=J({set:S.set,emp:S.emp});if(!d.metadata.hasPendingWrites)window.softRender()}
  else if(!d.metadata.fromCache)window.cloudPush()},err))}
onAuthStateChanged(auth,u=>{
 if(u){document.body.classList.add('in');E('who').textContent='\u2601 '+u.email+'  ';const b=document.createElement('button');b.className='s';b.textContent='Log out';b.onclick=()=>signOut(auth);E('who').appendChild(b);start();window.render()}
 else{unsubs.forEach(f=>f());unsubs=[];window.resetS();document.body.classList.remove('in');E('who').textContent=''}});
window.doLogin=()=>{E('lerr').textContent='';signInWithEmailAndPassword(auth,E('le').value.trim(),E('lp').value).catch(e=>{E('lerr').textContent=/invalid|wrong|user-not-found/.test(e.code)?'Wrong email or password.':'Sign-in failed: '+(e.code||e.message)})};
window.doReset=()=>{const em=E('le').value.trim();if(!em){E('lerr').textContent='Type your email first, then press Forgot password.';return}
 sendPasswordResetEmail(auth,em).then(()=>{E('lerr').textContent='Password reset email sent (check spam).'}).catch(e=>{E('lerr').textContent='Could not send: '+(e.code||e.message)})};
}
</script>
